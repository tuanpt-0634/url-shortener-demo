name = "url-shortener"
compatibility_date = "2024-01-01"
pages_build_output_dir = ".open-next/worker-cloudflare"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "url-shortener-db"
database_id = "" # Add your D1 database ID here after creation

# Environment variables
[vars]
NODE_ENV = "production"

# Development configuration
[env.development]
[[env.development.d1_databases]]
binding = "DB"
database_name = "url-shortener-db-dev"
database_id = "" # Add your development D1 database ID here
